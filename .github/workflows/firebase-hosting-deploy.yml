name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}" > .env

      - name: Generate firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode > lib/firebase_options.dart

      - name: Inject TMDB token into source
        run: sed -i 's|__TMDB_TOKEN__|'"${{ secrets.TMDB_READ_TOKEN }}"'|' lib/services/tmdb_service.dart

      - name: Verify token injection
        run: |
          if grep -q '__TMDB_TOKEN__' lib/services/tmdb_service.dart; then
            echo 'ERROR - placeholder was not replaced!'
            exit 1
          else
            echo 'Token injected successfully'
          fi

      - name: Build Flutter web
        run: flutter build web --release

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project filmmend-me
