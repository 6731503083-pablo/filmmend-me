name: filmmend_me
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+6

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  adaptive_platform_ui: ^0.1.6
  http: ^1.2.2
  url_launcher: ^6.2.6
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/app_icon.png"
  macos:
    generate: true
    image_path: "assets/logo/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
