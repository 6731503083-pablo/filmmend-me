name: filmmend_me
description: "A new Flutter project."
publish_to: "none"
version: 1.0.2+11

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  adaptive_platform_ui: ^0.1.6
  http: ^1.2.2
  url_launcher: ^6.2.6
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  flutter_dotenv: ^5.2.1
  share_plus: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/app_icon.png"
  macos:
    generate: true
    image_path: "assets/logo/app_icon.png"

flutter_native_splash:
  color: "#121A26"
  image: "assets/logo/splash_icon.png"
  android_12:
    image: "assets/logo/splash_icon.png"
    icon_background_color: "#121A26"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/
